e word you heard?",options:[{id:"a",text:"parliamentary"},{id:"b",text:"parlimentary"},{id:"c",text:"parliamentry"},{id:"d",text:"parlaimentary"}],correctAnswerId:"a"},{id:"ts-sp-t8-05",subject:"spelling",tier:8,skill:"hear-and-spell",format:"listen",listenWord:"indistinguishable",questionText:"Which one spells the word you heard?",questionTextJunior:"Which one is the word you heard?",options:[{id:"a",text:"indistinguishable"},{id:"b",text:"indistinguisable"},{id:"c",text:"indistinquishable"},{id:"d",text:"indistingishable"}],correctAnswerId:"a"},{id:"ts-sp-t8-06",subject:"spelling",tier:8,skill:"hear-and-spell",format:"listen",listenWord:"liaison",questionText:"Which one spells the word you heard?",questionTextJunior:"Which one is the word you heard?",options:[{id:"a",text:"liaison"},{id:"b",text:"liason"},{id:"c",text:"liasion"},{id:"d",text:"liaision"}],correctAnswerId:"a"},{id:"ts-sp-t8-drag",subject:"spelling",tier:8,skill:"hear-in-a-sentence",format:"listen",answerMode:"drag",listenWord:"bureaucratic",listenSentence:"The delay was entirely bureaucratic.",questionText:"Drag the right spelling into the gap.",questionTextJunior:"Drag the right spelling into the gap.",options:[{id:"a",text:"bureaucratic"},{id:"b",text:"beaurocratic"},{id:"c",text:"bureacratic"},{id:"d",text:"bureaucratick"}],correctAnswerId:"a"},{id:"ts-rc-t0-01",subject:"reading-comprehension",tier:0,skill:"sequence",format:"study",passageTitle:"The Hat",passage:"Kim put on her sun hat. Then she went outside to play.",questionText:"What did Kim do first?",options:[{id:"a",text:"She put on her hat"},{id:"b",text:"She went outside"},{id:"c",text:"She played"},{id:"d",text:"She had lunch"}],correctAnswerId:"a"},{id:"ts-rc-t0-02",subject:"reading-comprehension",tier:0,skill:"literal-recall",format:"study",passageTitle:"Blue Socks",passage:"Tom could only find one blue sock. The other one was in the wash.",questionText:"Where was the missing sock?",options:[{id:"a",text:"In the wash"},{id:"b",text:"Under the bed"},{id:"c",text:"At school"},{id:"d",text:"In his shoe"}],correctAnswerId:"a"},{id:"ts-rc-t0-03",subject:"reading-comprehension",tier:0,skill:"literal-recall",format:"study",passageTitle:"The Nest",passage:"Two small birds built a nest in our tree. Now there are eggs in it.",questionText:"What is in the nest?",options:[{id:"a",text:"Eggs"},{id:"b",text:"Leaves"},{id:"c",text:"Nothing"},{id:"d",text:"A squirrel"}],correctAnswerId:"a"},{id:"ts-rc-t0-04",subject:"reading-comprehension",tier:0,skill:"inference",format:"study",passageTitle:"The Dog",passage:"My dog ran to the gate. He wanted to go out.",questionText:"What did the dog want?",options:[{id:"a",text:"To go out"},{id:"b",text:"To eat"},{id:"c",text:"To sleep"},{id:"d",text:"To play inside"}],correctAnswerId:"a"},{id:"ts-rc-t0-05",subject:"reading-comprehension",tier:0,skill:"sequence",format:"study",passageTitle:"Bedtime",passage:"Dad read me a story. Then he turned off the light.",questionText:"What happened last?",options:[{id:"a",text:"Dad turned off the light"},{id:"b",text:"Dad read a story"},{id:"c",text:"I got up"},{id:"d",text:"We ate dinner"}],correctAnswerId:"a"},{id:"ts-rc-t0-06",subject:"reading-comprehension",tier:0,skill:"literal-recall",format:"study",passageTitle:"The Bus",passage:"The yellow bus stopped. All the children got on.",questionText:"Who got on the bus?",options:[{id:"a",text:"The children"},{id:"b",text:"The driver"},{id:"c",text:"A dog"},{id:"d",text:"No one"}],correctAnswerId:"a"},{id:"ts-rc-t1-01",subject:"reading-comprehension",tier:1,skill:"feelings",format:"study",passageTitle:"The Big Wave",passage:"Ellie stood in the shallow water. A wave knocked her over, and she came up laughing.",questionText:"How did Ellie feel after the wave?",options:[{id:"a",text:"She thought it was fun"},{id:"b",text:"She was hurt"},{id:"c",text:"She was angry"},{id:"d",text:"She was frightened"}],correctAnswerId:"a"},{id:"ts-rc-t1-02",subject:"reading-comprehension",tier:1,skill:"cause-effect",format:"study",passageTitle:"Empty Shelf",passage:"Raj went to get cereal, but the shelf was empty. He had eaten the last of it yesterday.",questionText:"Why was the shelf empty?",options:[{id:"a",text:"Raj had finished the cereal"},{id:"b",text:"The shop was closed"},{id:"c",text:"Mum forgot to shop"},{id:"d",text:"The box fell down"}],correctAnswerId:"a"},{id:"ts-rc-t1-03",subject:"reading-comprehension",tier:1,skill:"sequence",format:"study",passageTitle:"The Loose Tooth",passage:"Ivy wiggled her tooth all through the lesson. At home tea time, it came out in her apple.",questionText:"When did the tooth come out?",options:[{id:"a",text:"At tea time"},{id:"b",text:"During the lesson"},{id:"c",text:"In the morning"},{id:"d",text:"At bedtime"}],correctAnswerId:"a"},{id:"ts-rc-t1-04",subject:"reading-comprehension",tier:1,skill:"literal-recall",format:"study",passageTitle:"The Kite",passage:"Ana's kite went higher and higher. Then the string broke.",questionText:"What happened to the kite?",options:[{id:"a",text:"The string broke"},{id:"b",text:"It landed safely"},{id:"c",text:"It got stuck in a tree"},{id:"d",text:"It never flew"}],correctAnswerId:"a"},{id:"ts-rc-t1-05",subject:"reading-comprehension",tier:1,skill:"cause-effect",format:"study",passageTitle:"Cold Hands",passage:"Tom forgot his gloves. By the end of the walk his hands hurt.",questionText:"Why did Tom's hands hurt?",options:[{id:"a",text:"He had no gloves"},{id:"b",text:"He fell over"},{id:"c",text:"He carried a bag"},{id:"d",text:"He hit a wall"}],correctAnswerId:"a"},{id:"ts-rc-t1-06",subject:"reading-comprehension",tier:1,skill:"sequence",format:"study",passageTitle:"The Window Box",passage:"Grandma planted seeds in a box on the sill. By summer the whole window was yellow.",questionText:"What did the seeds become?",options:[{id:"a",text:"Flowers"},{id:"b",text:"Trees"},{id:"c",text:"Weeds"},{id:"d",text:"Vegetables"}],correctAnswerId:"a"},{id:"ts-rc-t2-01",subject:"reading-comprehension",tier:2,skill:"inference",format:"study",passageTitle:"Wrong Bag",passage:"Owen grabbed a backpack that looked just like his. He knew at once, because his own was much heavier.",questionText:"How did Owen know the bag was not his?",options:[{id:"a",text:"It weighed less than his"},{id:"b",text:"It was a different colour"},{id:"c",text:"His name was missing"},{id:"d",text:"The zip was broken"}],correctAnswerId:"a"},{id:"ts-rc-t2-02",subject:"reading-comprehension",tier:2,skill:"cause-effect",format:"study",passageTitle:"The Quiet Cricket",passage:"The cricket chirped every night by the back step. On the night it turned cold, the garden went silent.",questionText:"Why did the garden go quiet?",options:[{id:"a",text:"The cold stopped the cricket"},{id:"b",text:"Someone moved the step"},{id:"c",text:"It started raining"},{id:"d",text:"The cricket got louder"}],correctAnswerId:"a"},{id:"ts-rc-t2-03",subject:"reading-comprehension",tier:2,skill:"character",format:"study",passageTitle:"Two Umbrellas",passage:"Dad took an umbrella even though the sky was clear. By the time we walked home, ours was the only dry family on the street.",questionText:"What does this show about Dad?",options:[{id:"a",text:"He planned ahead"},{id:"b",text:"He liked carrying things"},{id:"c",text:"He was lucky"},{id:"d",text:"He disliked walking"}],correctAnswerId:"a"},{id:"ts-rc-t2-04",subject:"reading-comprehension",tier:2,skill:"inference",format:"study",passageTitle:"Saturday Morning",passage:"Mum stirred while I counted out the raisins. We always drop one, and the dog is always waiting underneath.",questionText:"What does the dog do?",options:[{id:"a",text:"Eats the dropped blueberry"},{id:"b",text:"Helps stir"},{id:"c",text:"Counts berries"},{id:"d",text:"Hides"}],correctAnswerId:"a"},{id:"ts-rc-t2-05",subject:"reading-comprehension",tier:2,skill:"character",format:"study",passageTitle:"The New Boy",passage:"Nobody sat with the new boy at lunch. Priya moved her tray over and asked his name.",questionText:"What does Priya’s action show about her?",options:[{id:"a",text:"Kind"},{id:"b",text:"Shy"},{id:"c",text:"Rude"},{id:"d",text:"Angry"}],correctAnswerId:"a"},{id:"ts-rc-t2-06",subject:"reading-comprehension",tier:2,skill:"literal-recall",format:"study",passageTitle:"The Torn Page",passage:"Leo found a page torn from his library book. He told the librarian right away.",questionText:"What did Leo do about it?",options:[{id:"a",text:"He told the librarian"},{id:"b",text:"He hid the book"},{id:"c",text:"He fixed it himself"},{id:"d",text:"He kept quiet"}],correctAnswerId:"a"},{id:"ts-rc-t3-01",subject:"reading-comprehension",tier:3,skill:"inference",format:"study",passageTitle:"The Broken Clock",passage:"The kitchen clock stopped at ten past four, and for a week nobody noticed. We had all been reading the time off our phones.",questionText:"Why did nobody notice?",options:[{id:"a",text:"They checked their phones instead"},{id:"b",text:"The clock was hidden"},{id:"c",text:"They were away"},{id:"d",text:"The clock looked right"}],correctAnswerId:"a"},{id:"ts-rc-t3-02",subject:"reading-comprehension",tier:3,skill:"character",format:"study",passageTitle:"Last In Line",passage:"Hugo let three people go ahead of him and ended up last. He said he did not mind, because he got to see everyone else's face when they saw the view.",questionText:"Why did Hugo not mind being last?",options:[{id:"a",text:"He enjoyed watching the others' reactions"},{id:"b",text:"He was not interested in the view"},{id:"c",text:"He wanted to leave early"},{id:"d",text:"He was tired of waiting"}],correctAnswerId:"a"},{id:"ts-rc-t3-03",subject:"reading-comprehension",tier:3,skill:"reasoning",format:"study",passageTitle:"The Spare Key",passage:"We keep a spare key with the neighbour rather than under a plant pot. A key everyone knows how to find is not much of a secret.",questionText:"Why not use the plant pot?",options:[{id:"a",text:"It is an obvious hiding place"},{id:"b",text:"The pot is too small"},{id:"c",text:"The neighbour insisted"},{id:"d",text:"The key does not fit"}],correctAnswerId:"a"},{id:"ts-rc-t3-04",subject:"reading-comprehension",tier:3,skill:"inference",format:"study",passageTitle:"The Locked Door",passage:"Maya turned the handle twice before she noticed the note taped at eye level. Closed today, it said.",questionText:"Why would the door not open?",options:[{id:"a",text:"The place was closed"},{id:"b",text:"The handle was broken"},{id:"c",text:"She had the wrong key"},{id:"d",text:"It was stuck"}],correctAnswerId:"a"},{id:"ts-rc-t3-05",subject:"reading-comprehension",tier:3,skill:"inference",format:"study",passageTitle:"First Snow",passage:"The class stopped listening the moment the first flakes passed the window. Mr Dale sighed and let them watch.",questionText:"Why did Mr Dale sigh?",options:[{id:"a",text:"He knew he had lost their attention"},{id:"b",text:"He was cold"},{id:"c",text:"He disliked snow"},{id:"d",text:"He was unwell"}],correctAnswerId:"a"},{id:"ts-rc-t3-06",subject:"reading-comprehension",tier:3,skill:"cause-effect",format:"study",passageTitle:"The Recipe",passage:"The recipe said to let the dough rest for an hour. We were hungry, so we baked it right away, and it came out flat.",questionText:"Why was the bread flat?",options:[{id:"a",text:"The dough did not rest"},{id:"b",text:"The oven was cold"},{id:"c",text:"There was no flour"},{id:"d",text:"It baked too long"}],correctAnswerId:"a"},{id:"ts-rc-t4-01",subject:"reading-comprehension",tier:4,skill:"cause-effect",format:"study",passageTitle:"The Understudy",passage:"Priya learned every line of a part she never expected to play. On the third night the lead lost her voice, and Priya walked on without a script.",questionText:"Why was Priya ready?",options:[{id:"a",text:"She had learned the part anyway"},{id:"b",text:"She was told in advance"},{id:"c",text:"She read from a script"},{id:"d",text:"She wrote the play"}],correctAnswerId:"a"},{id:"ts-rc-t4-02",subject:"reading-comprehension",tier:4,skill:"inference",format:"study",passageTitle:"The Slow Train",passage:"The express reaches the coast in two hours; the local takes four and stops at eleven villages. My grandfather has always chosen the local.",questionText:"What does his choice suggest?",options:[{id:"a",text:"He values the journey itself"},{id:"b",text:"He cannot afford the express"},{id:"c",text:"He dislikes the coast"},{id:"d",text:"He is always late"}],correctAnswerId:"a"},{id:"ts-rc-t4-03",subject:"reading-comprehension",tier:4,skill:"detail",format:"study",passageTitle:"The Missing Page",passage:"The recipe book was passed down three generations, and the page for the honey cake is gone. Nobody knows whether it was lost or taken.",questionText:"What is uncertain about the page?",options:[{id:"a",text:"How it disappeared"},{id:"b",text:"Which cake it held"},{id:"c",text:"Who wrote the book"},{id:"d",text:"How old the book is"}],correctAnswerId:"a"},{id:"ts-rc-t4-04",subject:"reading-comprehension",tier:4,skill:"character",format:"study",passageTitle:"The Relay",passage:"Jonah dropped the baton on the last handover. His team still crowded round him at the finish, laughing.",questionText:"How did the team treat Jonah?",options:[{id:"a",text:"They stayed friendly"},{id:"b",text:"They blamed him"},{id:"c",text:"They ignored him"},{id:"d",text:"They left early"}],correctAnswerId:"a"},{id:"ts-rc-t4-05",subject:"reading-comprehension",tier:4,skill:"author-view",format:"study",passageTitle:"The Old Map",passage:"The map showed a road that no longer exists and a lake that has since been drained. It is useless for finding your way, and priceless for understanding the place.",questionText:"What is the map good for?",options:[{id:"a",text:"Understanding the area's past"},{id:"b",text:"Navigating today"},{id:"c",text:"Measuring distances"},{id:"d",text:"Finding the lake"}],correctAnswerId:"a"},{id:"ts-rc-t4-06",subject:"reading-comprehension",tier:4,skill:"inference",format:"study",passageTitle:"The Audition",passage:"Sara practised the same eight bars for three weeks. When her name was called she found her hands were steady.",questionText:"Why were her hands steady?",options:[{id:"a",text:"She had prepared thoroughly"},{id:"b",text:"She was not nervous by nature"},{id:"c",text:"The piece was easy"},{id:"d",text:"She had given up caring"}],correctAnswerId:"a"},{id:"ts-rc-t5-01",subject:"reading-comprehension",tier:5,skill:"cause-effect",format:"study",passageTitle:"The Sourdough",passage:"A baker in Nanaimo has kept the same starter alive since 1974, feeding it flour and water every day. Skip a week and decades of work are gone.",questionText:"Why must the starter be fed daily?",options:[{id:"a",text:"It dies if neglected"},{id:"b",text:"It tastes better fresh"},{id:"c",text:"It doubles in size"},{id:"d",text:"The law requires it"}],correctAnswerId:"a"},{id:"ts-rc-t5-02",subject:"reading-comprehension",tier:5,skill:"author-view",format:"study",passageTitle:"The Second Draft",passage:"Our teacher makes us hand in the rough version stapled behind the neat one. She says she is marking the distance between them.",questionText:"What is the teacher actually assessing?",options:[{id:"a",text:"How much the work improved"},{id:"b",text:"How neat the final copy is"},{id:"c",text:"How fast students write"},{id:"d",text:"How long the essay is"}],correctAnswerId:"a"},{id:"ts-rc-t5-03",subject:"reading-comprehension",tier:5,skill:"inference",format:"study",passageTitle:"The Quiet Car",passage:"One carriage on the morning train has no phone calls and no music. It fills first, every day, before any of the others.",questionText:"What does filling first suggest?",options:[{id:"a",text:"Many passengers want quiet"},{id:"b",text:"It has the most seats"},{id:"c",text:"It is nearest the door"},{id:"d",text:"It is cheaper"}],correctAnswerId:"a"},{id:"ts-rc-t5-04",subject:"reading-comprehension",tier:5,skill:"cause-effect",format:"study",passageTitle:"The Tide",passage:"Twice a day the bay empties until boats sit on mud, then fills again. Visitors who moor without checking the tables find themselves stranded by lunchtime.",questionText:"Why do visitors get stranded?",options:[{id:"a",text:"They did not check the tide tables"},{id:"b",text:"Their boats are too heavy"},{id:"c",text:"The bay never refills"},{id:"d",text:"They arrive too early"}],correctAnswerId:"a"},{id:"ts-rc-t5-05",subject:"reading-comprehension",tier:5,skill:"character",format:"study",passageTitle:"The Volunteer",passage:"Every Saturday for eleven years Ms Okafor has opened the food bank at eight. She says she keeps a key so nobody has to wait in the rain.",questionText:"What does her reason reveal?",options:[{id:"a",text:"She thinks about others' comfort"},{id:"b",text:"She dislikes being late"},{id:"c",text:"She wants the job"},{id:"d",text:"She lives nearby"}],correctAnswerId:"a"},{id:"ts-rc-t5-06",subject:"reading-comprehension",tier:5,skill:"cause-effect",format:"study",passageTitle:"The Power Line",passage:"A single fallen line left four thousand homes dark. Crews reached it by snowmobile, because the road had closed hours earlier.",questionText:"Why did crews use snowmobiles?",options:[{id:"a",text:"The road was closed"},{id:"b",text:"It was faster than driving"},{id:"c",text:"There were no trucks"},{id:"d",text:"The line was on a lake"}],correctAnswerId:"a"},{id:"ts-rc-t6-01",subject:"reading-comprehension",tier:6,skill:"cause-effect",format:"study",passageTitle:"Lighthouse Keepers",passage:"Automation removed the last keepers from Canadian lighthouses in stages, but a handful of stations kept theirs — partly because a person can see a boat in trouble that a lamp cannot.",questionText:"Why were some keepers kept on?",options:[{id:"a",text:"A person can spot a vessel in distress"},{id:"b",text:"The lamps were unreliable"},{id:"c",text:"Automation was too costly"},{id:"d",text:"The stations were remote"}],correctAnswerId:"a"},{id:"ts-rc-t6-02",subject:"reading-comprehension",tier:6,skill:"detail",format:"study",passageTitle:"The Rebuilt Violin",passage:"The instrument was smashed in a fall and glued back from forty pieces. Players say it sounds warmer now, though nobody can explain why.",questionText:"What is unexplained?",options:[{id:"a",text:"Why the repaired violin sounds warmer"},{id:"b",text:"Who dropped it"},{id:"c",text:"How it was glued"},{id:"d",text:"Where it is kept"}],correctAnswerId:"a"},{id:"ts-rc-t6-03",subject:"reading-comprehension",tier:6,skill:"reasoning",format:"study",passageTitle:"The Long Count",passage:"Volunteers count migrating hawks from the same ridge every autumn, and have since 1954. One year's numbers mean little; seventy years of them show a trend.",questionText:"Why does the length of the record matter?",options:[{id:"a",text:"A trend only appears over many years"},{id:"b",text:"Volunteers improve with practice"},{id:"c",text:"Hawks change route yearly"},{id:"d",text:"The ridge is moving"}],correctAnswerId:"a"},{id:"ts-rc-t6-04",subject:"reading-comprehension",tier:6,skill:"main-idea",format:"study",passageTitle:"Coral",passage:"Coral looks like rock but is built by animals no larger than a grain of rice. A reef is the accumulated work of generations of them.",questionText:"What is the passage mainly explaining?",options:[{id:"a",text:"That reefs are built by tiny living animals"},{id:"b",text:"That coral is a kind of rock"},{id:"c",text:"That reefs are shrinking"},{id:"d",text:"That coral grows quickly"}],correctAnswerId:"a"},{id:"ts-rc-t6-05",subject:"reading-comprehension",tier:6,skill:"author-view",format:"study",passageTitle:"The Rewrite",passage:"The author threw away her first two hundred pages. She says nothing in them was wasted, because they taught her what the book was not.",questionText:"What does she mean?",options:[{id:"a",text:"The discarded work still had value"},{id:"b",text:"The pages were badly written"},{id:"c",text:"She regrets starting"},{id:"d",text:"The book was finished"}],correctAnswerId:"a"},{id:"ts-rc-t6-06",subject:"reading-comprehension",tier:6,skill:"cause-effect",format:"study",passageTitle:"Standard Time",passage:"Before railways, every town kept its own clock by the sun. Timetables only became possible once whole regions agreed to share one time.",questionText:"Why was shared time needed?",options:[{id:"a",text:"So timetables could work across places"},{id:"b",text:"So clocks would be cheaper"},{id:"c",text:"So the sun would be accurate"},{id:"d",text:"So towns could compete"}],correctAnswerId:"a"},{id:"ts-rc-t7-01",subject:"reading-comprehension",tier:7,skill:"reasoning",format:"study",passageTitle:"The Replica",passage:"A gallery hangs a painted copy where the original once hung, labelled plainly as a replica. Visitors still stop in front of it for as long as they stopped for the original.",questionText:"What does visitor behaviour suggest?",options:[{id:"a",text:"The image affects people regardless of authorship"},{id:"b",text:"Nobody reads the labels"},{id:"c",text:"The replica is better"},{id:"d",text:"The original was disliked"}],correctAnswerId:"a"},{id:"ts-rc-t7-02",subject:"reading-comprehension",tier:7,skill:"main-idea",format:"study",passageTitle:"Salting the Roads",passage:"Road salt keeps winter traffic moving and ends up in the groundwater every spring. Cities are now weighing safety in January against water quality in June.",questionText:"What is the difficulty described?",options:[{id:"a",text:"One benefit comes at another's cost"},{id:"b",text:"Salt does not melt ice"},{id:"c",text:"Groundwater is scarce"},{id:"d",text:"Traffic stops in winter"}],correctAnswerId:"a"},{id:"ts-rc-t7-03",subject:"reading-comprehension",tier:7,skill:"author-view",format:"study",passageTitle:"The Unread Clause",passage:"Almost nobody reads the terms they agree to, and companies write them knowing this. The consent is real in law and close to meaningless in practice.",questionText:"What contrast is drawn?",options:[{id:"a",text:"Between legal consent and informed consent"},{id:"b",text:"Between long and short contracts"},{id:"c",text:"Between buyers and sellers"},{id:"d",text:"Between old and new laws"}],correctAnswerId:"a"},{id:"ts-rc-t7-04",subject:"reading-comprehension",tier:7,skill:"detail",format:"study",passageTitle:"The Retraction",passage:"A journal withdrew a paper after the original data could not be found. The authors had made no accusation against them, but the finding no longer stands.",questionText:"Why was the paper withdrawn?",options:[{id:"a",text:"Its underlying data could not be produced"},{id:"b",text:"The authors were dishonest"},{id:"c",text:"It was unpopular"},{id:"d",text:"It was too long"}],correctAnswerId:"a"},{id:"ts-rc-t7-05",subject:"reading-comprehension",tier:7,skill:"author-view",format:"study",passageTitle:"Loan Words",passage:"English has borrowed so heavily that much of its everyday vocabulary began elsewhere. Speakers rarely notice, which is a fair measure of how completely the words have been absorbed.",questionText:"What does the writer take as evidence of absorption?",options:[{id:"a",text:"That speakers do not notice the words are borrowed"},{id:"b",text:"That the words are old"},{id:"c",text:"That the words are short"},{id:"d",text:"That other languages borrowed back"}],correctAnswerId:"a"},{id:"ts-rc-t7-06",subject:"reading-comprehension",tier:7,skill:"cause-effect",format:"study",passageTitle:"The Detour",passage:"The bridge closure added forty minutes to every crossing, and within a month the shops on the old route reported takings down by a third.",questionText:"What connection does the passage draw?",options:[{id:"a",text:"Traffic changes affected local trade"},{id:"b",text:"The shops raised their prices"},{id:"c",text:"The bridge was unsafe"},{id:"d",text:"Drivers preferred the detour"}],correctAnswerId:"a"},{id:"ts-rc-t8-01",subject:"reading-comprehension",tier:8,skill:"reasoning",format:"study",passageTitle:"Goodhart's Law",passage:"When a measure becomes a target it stops measuring well, because people optimise for the number rather than the thing it stood for. Hospitals judged on waiting times found ways to shorten the wait without treating anyone sooner.",questionText:"What does the hospital example illustrate?",options:[{id:"a",text:"A target can be met without the underlying improvement"},{id:"b",text:"Waiting times do not matter"},{id:"c",text:"Measurement is impossible"},{id:"d",text:"Hospitals are dishonest by nature"}],correctAnswerId:"a"},{id:"ts-rc-t8-02",subject:"reading-comprehension",tier:8,skill:"reasoning",format:"study",passageTitle:"The Restored Wetland",passage:"Engineers spent a decade returning a drained field to marsh, then let it alone. The species that returned were not the ones anyone had planned for, and the water ran clearer than the models predicted.",questionText:"What does the outcome suggest about the plan?",options:[{id:"a",text:"The system did better than the predictions anticipated"},{id:"b",text:"The restoration failed"},{id:"c",text:"The models were deliberately wrong"},{id:"d",text:"No species returned"}],correctAnswerId:"a"},{id:"ts-rc-t8-03",subject:"reading-comprehension",tier:8,skill:"reasoning",format:"study",passageTitle:"Anonymous Review",passage:"Removing names from submissions changed which papers were accepted, and the effect was largest for authors from unfamiliar institutions. The work had not improved; only what reviewers could see about it had changed.",questionText:"What does the passage imply about the earlier process?",options:[{id:"a",text:"Judgements were influenced by the authors' identity"},{id:"b",text:"Reviewers were incompetent"},{id:"c",text:"The papers were poorly written"},{id:"d",text:"Anonymity lowered standards"}],correctAnswerId:"a"},{id:"ts-rc-t8-04",subject:"reading-comprehension",tier:8,skill:"reasoning",format:"study",passageTitle:"Survivorship",passage:"Engineers studying returning aircraft first reinforced the areas that showed damage. The insight that changed the analysis was that the planes hit elsewhere had not come back at all.",questionText:"What error did the original approach make?",options:[{id:"a",text:"It drew conclusions only from what survived"},{id:"b",text:"It ignored the damage shown"},{id:"c",text:"It reinforced too much"},{id:"d",text:"It counted planes twice"}],correctAnswerId:"a"},{id:"ts-rc-t8-05",subject:"reading-comprehension",tier:8,skill:"reasoning",format:"study",passageTitle:"The Null Result",passage:"Studies finding no effect are published far less often than studies finding one, which means the literature as a whole overstates how reliable an effect is.",questionText:"Why does this distort the record?",options:[{id:"a",text:"The evidence against an effect is under-reported"},{id:"b",text:"Null studies are poorly conducted"},{id:"c",text:"Journals invent findings"},{id:"d",text:"Effects are usually large"}],correctAnswerId:"a"},{id:"ts-rc-t8-06",subject:"reading-comprehension",tier:8,skill:"figurative",format:"study",passageTitle:"Measured Prose",passage:"He writes as though every adjective costs him something. The restraint is not coldness; it is the reason the rare warm sentence lands as hard as it does.",questionText:"What is the critic arguing?",options:[{id:"a",text:"Restraint gives the warm moments their force"},{id:"b",text:"The writing is emotionless"},{id:"c",text:"He uses too few words"},{id:"d",text:"Adjectives should be avoided"}],correctAnswerId:"a"},{id:"ts-vo-t0-01",subject:"vocabulary",tier:0,skill:"word-meaning",format:"study",studyWord:"cat",studyMeaning:"A small furry pet that says “meow”.",questionText:"Which animal says “meow”?",options:[{id:"a",text:"Dog"},{id:"b",text:"Cat"},{id:"c",text:"Cow"}],correctAnswerId:"b"},{id:"ts-vo-t0-02",subject:"vocabulary",tier:0,skill:"word-meaning",format:"study",studyWord:"big",studyMeaning:"Not small. Something large.",questionText:"Which one means the same as “big”?",options:[{id:"a",text:"Large"},{id:"b",text:"Tiny"},{id:"c",text:"Fast"}],correctAnswerId:"a"},{id:"ts-vo-t0-03",subject:"vocabulary",tier:0,skill:"word-meaning",format:"study",studyWord:"hot",studyMeaning:"Very warm. Too warm to touch.",questionText:"Which one would be hot?",options:[{id:"a",text:"An ice cube"},{id:"b",text:"The sun"},{id:"c",text:"A pillow"}],correctAnswerId:"b"},{id:"ts-vo-t0-04",subject:"vocabulary",tier:0,skill:"word-meaning",format:"study",studyWord:"run",studyMeaning:"To move very fast on your legs.",questionText:"Which one is running?",options:[{id:"a",text:"A girl racing to the gate"},{id:"b",text:"A boy asleep in bed"},{id:"c",text:"A cat sitting still"}],correctAnswerId:"a"},{id:"ts-vo-t0-05",subject:"vocabulary",tier:0,skill:"word-meaning",format:"study",studyWord:"wet",studyMeaning:"Covered in water.",questionText:"When would you be wet?",options:[{id:"a",text:"After a bath"},{id:"b",text:"After a nap"},{id:"c",text:"After a story"}],correctAnswerId:"a"},{id:"ts-vo-t1-01",subject:"vocabulary",tier:1,skill:"word-meaning",format:"study",studyWord:"brave",studyMeaning:"Not afraid, even when something is scary.",questionText:"Who is being brave?",options:[{id:"a",text:"A boy who hides from the dark"},{id:"b",text:"A girl who pats a big dog anyway"},{id:"c",text:"A boy who runs away"}],correctAnswerId:"b"},{id:"ts-vo-t1-02",subject:"vocabulary",tier:1,skill:"word-meaning",format:"study",studyWord:"tidy",studyMeaning:"Neat, with everything in its place.",questionText:"Which room is tidy?",options:[{id:"a",text:"Toys all over the floor"},{id:"b",text:"Every book back on the shelf"},{id:"c",text:"Clothes in a pile"}],correctAnswerId:"b"},{id:"ts-vo-t1-03",subject:"vocabulary",tier:1,skill:"word-meaning",format:"study",studyWord:"gentle",studyMeaning:"Soft and careful, not rough.",questionText:"Who is being gentle?",options:[{id:"a",text:"Someone stroking a kitten softly"},{id:"b",text:"Someone slamming a door"},{id:"c",text:"Someone shouting"}],correctAnswerId:"a"},{id:"ts-vo-t1-04",subject:"vocabulary",tier:1,skill:"word-meaning",format:"study",studyWord:"journey",studyMeaning:"A trip from one place to another.",questionText:"Which one is a journey?",options:[{id:"a",text:"A nap after lunch"},{id:"b",text:"A long drive to Grandma's"},{id:"c",text:"A glass of milk"}],correctAnswerId:"b"},{id:"ts-vo-t1-05",subject:"vocabulary",tier:1,skill:"word-meaning",format:"study",studyWord:"shiver",studyMeaning:"To shake because you are cold or scared.",questionText:"When might you shiver?",options:[{id:"a",text:"Standing outside in the snow"},{id:"b",text:"Sitting by a warm fire"},{id:"c",text:"Eating soup"}],correctAnswerId:"a"},{id:"ts-vo-t2-01",subject:"vocabulary",tier:2,skill:"word-meaning",format:"study",studyWord:"enormous",studyMeaning:"Very, very big — much bigger than usual.",questionText:"Which one is enormous?",options:[{id:"a",text:"A blue whale"},{id:"b",text:"A button"},{id:"c",text:"A paperclip"}],correctAnswerId:"a"},{id:"ts-vo-t2-02",subject:"vocabulary",tier:2,skill:"word-meaning",format:"study",studyWord:"ancient",studyMeaning:"Extremely old. From a very long time ago.",questionText:"Which one is ancient?",options:[{id:"a",text:"A new phone"},{id:"b",text:"A pyramid in Egypt"},{id:"c",text:"Today's newspaper"}],correctAnswerId:"b"},{id:"ts-vo-t2-03",subject:"vocabulary",tier:2,skill:"word-meaning",format:"study",studyWord:"delicate",studyMeaning:"Easy to break, so it must be handled with care.",questionText:"Which one is delicate?",options:[{id:"a",text:"A rubber ball"},{id:"b",text:"A thin glass ornament"},{id:"c",text:"A brick"}],correctAnswerId:"b"},{id:"ts-vo-t2-04",subject:"vocabulary",tier:2,skill:"word-meaning",format:"study",studyWord:"curious",studyMeaning:"Wanting to find out more about something.",questionText:"Who is curious?",options:[{id:"a",text:"A girl asking how the engine works"},{id:"b",text:"A boy ignoring the lesson"},{id:"c",text:"A cat asleep"}],correctAnswerId:"a"},{id:"ts-vo-t2-05",subject:"vocabulary",tier:2,skill:"word-meaning",format:"study",studyWord:"grumble",studyMeaning:"To complain in a low, quiet voice.",questionText:"Who is grumbling?",options:[{id:"a",text:"A boy muttering about the rain"},{id:"b",text:"A girl cheering loudly"},{id:"c",text:"A boy singing"}],correctAnswerId:"a"},{id:"ts-vo-t3-01",subject:"vocabulary",tier:3,skill:"word-meaning",format:"study",studyWord:"reluctant",studyMeaning:"Not wanting to do something, but doing it anyway.",questionText:"Who is reluctant?",options:[{id:"a",text:"A boy who races to the pool"},{id:"b",text:"A girl who drags her feet to the dentist"},{id:"c",text:"A boy who begs to go"}],correctAnswerId:"b"},{id:"ts-vo-t3-02",subject:"vocabulary",tier:3,skill:"word-meaning",format:"study",studyWord:"frantic",studyMeaning:"Rushing about in a panic.",questionText:"Who is frantic?",options:[{id:"a",text:"Someone calmly reading"},{id:"b",text:"Someone tearing the house apart for lost keys"},{id:"c",text:"Someone strolling"}],correctAnswerId:"b"},{id:"ts-vo-t3-03",subject:"vocabulary",tier:3,skill:"word-meaning",format:"study",studyWord:"sturdy",studyMeaning:"Strong and solid. Not easily broken.",questionText:"Which one is sturdy?",options:[{id:"a",text:"An oak table"},{id:"b",text:"A paper hat"},{id:"c",text:"A soap bubble"}],correctAnswerId:"a"},{id:"ts-vo-t3-04",subject:"vocabulary",tier:3,skill:"word-meaning",format:"study",studyWord:"vanish",studyMeaning:"To disappear suddenly and completely.",questionText:"What has vanished?",options:[{id:"a",text:"A coin left on the table"},{id:"b",text:"A puddle gone by noon"},{id:"c",text:"A rock in a field"}],correctAnswerId:"b"},{id:"ts-vo-t3-05",subject:"vocabulary",tier:3,skill:"word-meaning",format:"study",studyWord:"murmur",studyMeaning:"To speak so softly it is hard to hear.",questionText:"Who is murmuring?",options:[{id:"a",text:"A crowd cheering"},{id:"b",text:"A child whispering in a library"},{id:"c",text:"A dog barking"}],correctAnswerId:"b"},{id:"ts-vo-t4-01",subject:"vocabulary",tier:4,skill:"word-meaning",format:"study",studyWord:"reluctantly",studyMeaning:"Doing something even though you do not want to.",questionText:"Which sentence uses it correctly?",options:[{id:"a",text:"She reluctantly handed back the book she loved"},{id:"b",text:"She reluctantly cheered for her team"},{id:"c",text:"She reluctantly won the prize"}],correctAnswerId:"a"},{id:"ts-vo-t4-02",subject:"vocabulary",tier:4,skill:"word-meaning",format:"study",studyWord:"persuade",studyMeaning:"To talk someone into agreeing with you.",questionText:"Who is persuading?",options:[{id:"a",text:"A boy explaining why the trip is worth it"},{id:"b",text:"A boy reading alone"},{id:"c",text:"A boy watching TV"}],correctAnswerId:"a"},{id:"ts-vo-t4-03",subject:"vocabulary",tier:4,skill:"word-meaning",format:"study",studyWord:"abundant",studyMeaning:"Available in very large amounts. More than enough.",questionText:"Where is water abundant?",options:[{id:"a",text:"In a rainforest"},{id:"b",text:"In a desert"},{id:"c",text:"On the moon"}],correctAnswerId:"a"},{id:"ts-vo-t4-04",subject:"vocabulary",tier:4,skill:"word-meaning",format:"study",studyWord:"fragile",studyMeaning:"Easily damaged — needs careful handling.",questionText:"Which label belongs on a box of glass?",options:[{id:"a",text:"Fragile"},{id:"b",text:"Heavy"},{id:"c",text:"Waterproof"}],correctAnswerId:"a"},{id:"ts-vo-t4-05",subject:"vocabulary",tier:4,skill:"word-meaning",format:"study",studyWord:"summit",studyMeaning:"The very top of a mountain.",questionText:"Where is the summit?",options:[{id:"a",text:"At the base of the trail"},{id:"b",text:"Halfway up"},{id:"c",text:"At the highest point"}],correctAnswerId:"c"},{id:"ts-vo-t5-01",subject:"vocabulary",tier:5,skill:"word-meaning",format:"study",studyWord:"deteriorate",studyMeaning:"To get steadily worse over time.",questionText:"What is deteriorating?",options:[{id:"a",text:"A bridge slowly rusting through"},{id:"b",text:"A freshly painted fence"},{id:"c",text:"A new pair of boots"}],correctAnswerId:"a"},{id:"ts-vo-t5-02",subject:"vocabulary",tier:5,skill:"word-meaning",format:"study",studyWord:"sustain",studyMeaning:"To keep something going over a long time.",questionText:"Who is sustaining an effort?",options:[{id:"a",text:"A runner holding a steady pace for an hour"},{id:"b",text:"A runner who stops at the first corner"},{id:"c",text:"A runner who never started"}],correctAnswerId:"a"},{id:"ts-vo-t5-03",subject:"vocabulary",tier:5,skill:"word-meaning",format:"study",studyWord:"adjacent",studyMeaning:"Right next to something.",questionText:"Which house is adjacent to yours?",options:[{id:"a",text:"The one sharing your fence"},{id:"b",text:"The one across town"},{id:"c",text:"The one three streets over"}],correctAnswerId:"a"},{id:"ts-vo-t5-04",subject:"vocabulary",tier:5,skill:"word-meaning",format:"study",studyWord:"obstacle",studyMeaning:"Something in the way that makes progress harder.",questionText:"Which one is an obstacle?",options:[{id:"a",text:"A fallen tree across the trail"},{id:"b",text:"A clear open path"},{id:"c",text:"A helpful map"}],correctAnswerId:"a"},{id:"ts-vo-t5-05",subject:"vocabulary",tier:5,skill:"word-meaning",format:"study",studyWord:"hesitate",studyMeaning:"To pause because you are unsure.",questionText:"Who is hesitating?",options:[{id:"a",text:"A girl who stops at the edge of the diving board"},{id:"b",text:"A girl who jumps straight in"},{id:"c",text:"A girl already swimming"}],correctAnswerId:"a"},{id:"ts-vo-t6-01",subject:"vocabulary",tier:6,skill:"word-meaning",format:"study",studyWord:"inevitable",studyMeaning:"Certain to happen. Impossible to avoid.",questionText:"Which one is inevitable?",options:[{id:"a",text:"The sun setting tonight"},{id:"b",text:"Winning a lottery"},{id:"c",text:"Finding a coin"}],correctAnswerId:"a"},{id:"ts-vo-t6-02",subject:"vocabulary",tier:6,skill:"word-meaning",format:"study",studyWord:"scrutinize",studyMeaning:"To examine something very closely and carefully.",questionText:"Who is scrutinizing?",options:[{id:"a",text:"An inspector checking every weld on a bridge"},{id:"b",text:"A tourist glancing at a sign"},{id:"c",text:"A boy skimming a page"}],correctAnswerId:"a"},{id:"ts-vo-t6-03",subject:"vocabulary",tier:6,skill:"word-meaning",format:"study",studyWord:"plausible",studyMeaning:"Believable — it could reasonably be true.",questionText:"Which explanation is plausible?",options:[{id:"a",text:"The milk spoiled because the fridge broke"},{id:"b",text:"The milk spoiled because of the moon"},{id:"c",text:"The milk spoiled out of spite"}],correctAnswerId:"a"},{id:"ts-vo-t6-04",subject:"vocabulary",tier:6,skill:"word-meaning",format:"study",studyWord:"diminish",studyMeaning:"To become smaller or weaker.",questionText:"What is diminishing?",options:[{id:"a",text:"A candle burning down"},{id:"b",text:"A tree growing taller"},{id:"c",text:"A river in flood"}],correctAnswerId:"a"},{id:"ts-vo-t6-05",subject:"vocabulary",tier:6,skill:"word-meaning",format:"study",studyWord:"resilient",studyMeaning:"Able to recover quickly after something difficult.",questionText:"Who is resilient?",options:[{id:"a",text:"A player who trains again after losing"},{id:"b",text:"A player who quits after one loss"},{id:"c",text:"A player who never competes"}],correctAnswerId:"a"},{id:"ts-vo-t7-01",subject:"vocabulary",tier:7,skill:"word-meaning",format:"study",studyWord:"ambiguous",studyMeaning:"Having more than one possible meaning, so it is unclear.",questionText:"Which instruction is ambiguous?",options:[{id:"a",text:"“Leave it by the bank”"},{id:"b",text:"“Leave it on the kitchen table”"},{id:"c",text:"“Leave it in locker 14”"}],correctAnswerId:"a"},{id:"ts-vo-t7-02",subject:"vocabulary",tier:7,skill:"word-meaning",format:"study",studyWord:"meticulous",studyMeaning:"Extremely careful about every small detail.",questionText:"Who is being meticulous?",options:[{id:"a",text:"A watchmaker checking each gear"},{id:"b",text:"A painter splashing quickly"},{id:"c",text:"A cook guessing amounts"}],correctAnswerId:"a"},{id:"ts-vo-t7-03",subject:"vocabulary",tier:7,skill:"word-meaning",format:"study",studyWord:"mitigate",studyMeaning:"To make something bad less severe.",questionText:"Which action mitigates flooding?",options:[{id:"a",text:"Building a levee"},{id:"b",text:"Paving the whole valley"},{id:"c",text:"Removing the drains"}],correctAnswerId:"a"},{id:"ts-vo-t7-04",subject:"vocabulary",tier:7,skill:"word-meaning",format:"study",studyWord:"tentative",studyMeaning:"Not final — done as a first try and open to change.",questionText:"Which plan is tentative?",options:[{id:"a",text:"A draft schedule marked “subject to change”"},{id:"b",text:"A signed contract"},{id:"c",text:"A finished building"}],correctAnswerId:"a"},{id:"ts-vo-t7-05",subject:"vocabulary",tier:7,skill:"word-meaning",format:"study",studyWord:"unprecedented",studyMeaning:"Never having happened before.",questionText:"Which event is unprecedented?",options:[{id:"a",text:"The first landing on the moon"},{id:"b",text:"Sunrise this morning"},{id:"c",text:"A weekly staff meeting"}],correctAnswerId:"a"},{id:"ts-vo-t8-01",subject:"vocabulary",tier:8,skill:"word-meaning",format:"study",studyWord:"pragmatic",studyMeaning:"Judging by what actually works, not by theory.",questionText:"Who is being pragmatic?",options:[{id:"a",text:"An engineer choosing the design that ships on time"},{id:"b",text:"A theorist ignoring the budget"},{id:"c",text:"A planner refusing all compromise"}],correctAnswerId:"a"},{id:"ts-vo-t8-02",subject:"vocabulary",tier:8,skill:"word-meaning",format:"study",studyWord:"ubiquitous",studyMeaning:"Found everywhere at once.",questionText:"Which one is ubiquitous today?",options:[{id:"a",text:"The smartphone"},{id:"b",text:"The telegraph"},{id:"c",text:"The penny-farthing"}],correctAnswerId:"a"},{id:"ts-vo-t8-03",subject:"vocabulary",tier:8,skill:"word-meaning",format:"study",studyWord:"substantiate",studyMeaning:"To back a claim up with evidence.",questionText:"Who has substantiated a claim?",options:[{id:"a",text:"A researcher publishing the data behind it"},{id:"b",text:"A speaker repeating it louder"},{id:"c",text:"A writer asserting it twice"}],correctAnswerId:"a"},{id:"ts-vo-t8-04",subject:"vocabulary",tier:8,skill:"word-meaning",format:"study",studyWord:"nuance",studyMeaning:"A small difference in meaning that matters.",questionText:"Which pair differs by nuance?",options:[{id:"a",text:"“Confident” and “arrogant”"},{id:"b",text:"“Cat” and “bicycle”"},{id:"c",text:"“Hot” and “cold”"}],correctAnswerId:"a"},{id:"ts-vo-t8-05",subject:"vocabulary",tier:8,skill:"word-meaning",format:"study",studyWord:"juxtapose",studyMeaning:"To place two things side by side to show the contrast.",questionText:"Who is juxtaposing?",options:[{id:"a",text:"An editor printing the two photos together for comparison"},{id:"b",text:"An editor deleting one photo"},{id:"c",text:"An editor enlarging a photo"}],correctAnswerId:"a"},{id:"ts-or-t0-01",subject:"oral-reading",tier:0,skill:"read-aloud",format:"speak",spokenPassage:"Look at my dog. See it run. I like my dog. My dog likes me.",passageTitle:"My Dog",questionText:"Read “My Dog” out loud.",questionTextJunior:"Read “My Dog” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t0-02",subject:"oral-reading",tier:0,skill:"read-aloud",format:"speak",spokenPassage:"I go to school. I see my friend. We play. We like school.",passageTitle:"At School",questionText:"Read “At School” out loud.",questionTextJunior:"Read “At School” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t0-03",subject:"oral-reading",tier:0,skill:"read-aloud",format:"speak",spokenPassage:"The cat is big. The cat can sit. I see the cat. The cat is mine.",passageTitle:"The Cat",questionText:"Read “The Cat” out loud.",questionTextJunior:"Read “The Cat” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t1-01",subject:"oral-reading",tier:1,skill:"read-aloud",format:"speak",spokenPassage:"The red truck is loud. It goes up the hill. Dad waves at me. I wave back at Dad.",passageTitle:"The Red Truck",questionText:"Read “The Red Truck” out loud.",questionTextJunior:"Read “The Red Truck” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t1-02",subject:"oral-reading",tier:1,skill:"read-aloud",format:"speak",spokenPassage:"It snowed all night. The yard is white. I pull on my boots. Then I run outside to play.",passageTitle:"Snow Day",questionText:"Read “Snow Day” out loud.",questionTextJunior:"Read “Snow Day” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t1-03",subject:"oral-reading",tier:1,skill:"read-aloud",format:"speak",spokenPassage:"I open my lunch box. There is an apple inside. I eat it fast. Apples are my favourite.",passageTitle:"My Lunch",questionText:"Read “My Lunch” out loud.",questionTextJunior:"Read “My Lunch” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t2-01",subject:"oral-reading",tier:2,skill:"read-aloud",format:"speak",spokenPassage:"Sam lost one mitten on the walk home. He looked under the bench and behind the gate. His sister found it later, stuck in the snow by the fence.",passageTitle:"The Lost Mitten",questionText:"Read “The Lost Mitten” out loud.",questionTextJunior:"Read “The Lost Mitten” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t2-02",subject:"oral-reading",tier:2,skill:"read-aloud",format:"speak",spokenPassage:"On Saturday we make pancakes. Mom stirs the batter while I count the blueberries. We always drop one on the floor, and the dog is always ready.",passageTitle:"Pancakes",questionText:"Read “Pancakes” out loud.",questionTextJunior:"Read “Pancakes” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t2-03",subject:"oral-reading",tier:2,skill:"read-aloud",format:"speak",spokenPassage:"A beaver built a dam across the creek. It carried branches in its wide flat teeth. By morning the water had spread into a shallow pond.",passageTitle:"The Beaver",questionText:"Read “The Beaver” out loud.",questionTextJunior:"Read “The Beaver” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t3-01",subject:"oral-reading",tier:3,skill:"read-aloud",format:"speak",spokenPassage:"We packed the canoe before sunrise, when the lake was still flat as glass. My uncle showed me how to hold the paddle so it would not splash. By the time the sun came up, we were far out on the water.",passageTitle:"The Canoe Trip",questionText:"Read “The Canoe Trip” out loud.",questionTextJunior:"Read “The Canoe Trip” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t3-02",subject:"oral-reading",tier:3,skill:"read-aloud",format:"speak",spokenPassage:"Nadia signed her name carefully on the back of her first library card. The librarian explained that she could borrow six books at a time. Nadia took exactly six, even though carrying them made her arms ache.",passageTitle:"Library Card",questionText:"Read “Library Card” out loud.",questionTextJunior:"Read “Library Card” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t3-03",subject:"oral-reading",tier:3,skill:"read-aloud",format:"speak",spokenPassage:"The wind pushed against the windows all afternoon. Our power went out just before supper, so we ate by candlelight. My brother said it felt like camping, only warmer.",passageTitle:"The Storm",questionText:"Read “The Storm” out loud.",questionTextJunior:"Read “The Storm” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t4-01",subject:"oral-reading",tier:4,skill:"read-aloud",format:"speak",spokenPassage:"Every year our school holds a science fair in the gymnasium. Last spring I built a model volcano that erupted twice before the judges arrived. My teacher said the second eruption was more convincing than the first, which I decided to take as a compliment.",passageTitle:"The Science Fair",questionText:"Read “The Science Fair” out loud.",questionTextJunior:"Read “The Science Fair” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t4-02",subject:"oral-reading",tier:4,skill:"read-aloud",format:"speak",spokenPassage:"My grandmother woke us at midnight and told us to put our coats on over our pyjamas. Green light rippled across the whole northern sky, folding and unfolding like a curtain. Nobody said anything for a long time.",passageTitle:"Northern Lights",questionText:"Read “Northern Lights” out loud.",questionTextJunior:"Read “Northern Lights” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t4-03",subject:"oral-reading",tier:4,skill:"read-aloud",format:"speak",spokenPassage:"The trail to the lookout climbed steadily for two kilometres before it levelled off. I wanted to stop halfway, but my cousin promised the view was worth it. When we finally reached the top, I had to admit she was right.",passageTitle:"The Long Walk",questionText:"Read “The Long Walk” out loud.",questionTextJunior:"Read “The Long Walk” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t5-01",subject:"oral-reading",tier:5,skill:"read-aloud",format:"speak",spokenPassage:"In winter the river freezes hard enough to drive across, and crews mark a road on the ice with small spruce trees. Trucks carry fuel and supplies to communities that have no highway the rest of the year. The road exists for only a few weeks, and then the ice remembers it was a river.",passageTitle:"The Ice Road",questionText:"Read “The Ice Road” out loud.",questionTextJunior:"Read “The Ice Road” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t5-02",subject:"oral-reading",tier:5,skill:"read-aloud",format:"speak",spokenPassage:"Elijah McCoy designed a device that oiled train engines while they were still moving. Before his invention, engineers had to stop the train and oil the parts by hand, which wasted hours on every trip. Railways across the continent eventually adopted his design.",passageTitle:"The Inventor",questionText:"Read “The Inventor” out loud.",questionTextJunior:"Read “The Inventor” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t5-03",subject:"oral-reading",tier:5,skill:"read-aloud",format:"speak",spokenPassage:"Our class turned the empty lot beside the school into a vegetable garden. We hauled soil in wheelbarrows and argued for a week about what to plant. By August the tomatoes had grown taller than most of the students who planted them.",passageTitle:"The Garden",questionText:"Read “The Garden” out loud.",questionTextJunior:"Read “The Garden” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t6-01",subject:"oral-reading",tier:6,skill:"read-aloud",format:"speak",spokenPassage:"Engineers build bridges to bend slightly rather than stand perfectly rigid. A structure that cannot move at all will crack when the temperature changes or the wind pushes against it. Flexibility, in this case, is not a weakness but the entire point.",passageTitle:"The Bridge",questionText:"Read “The Bridge” out loud.",questionTextJunior:"Read “The Bridge” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t6-02",subject:"oral-reading",tier:6,skill:"read-aloud",format:"speak",spokenPassage:"Each autumn the Arctic tern leaves the Arctic and flies nearly to Antarctica, then turns around and does it again in spring. Over a lifetime, a single bird may travel far enough to reach the moon and return. Scientists still do not fully understand how it navigates.",passageTitle:"Migration",questionText:"Read “Migration” out loud.",questionTextJunior:"Read “Migration” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t6-03",subject:"oral-reading",tier:6,skill:"read-aloud",format:"speak",spokenPassage:"The town archive occupies two rooms above the old post office, and almost nobody visits. Inside are newspapers, photographs and letters covering a hundred and forty years. The volunteer who runs it says the hardest part is deciding what is worth keeping.",passageTitle:"The Archive",questionText:"Read “The Archive” out loud.",questionTextJunior:"Read “The Archive” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t7-01",subject:"oral-reading",tier:7,skill:"read-aloud",format:"speak",spokenPassage:"Beneath much of the northern landscape lies permafrost, ground that has remained frozen for thousands of years. As temperatures rise, that ground begins to thaw, and buildings constructed on what was once solid footing start to tilt. Communities are now rebuilding infrastructure that was designed for a climate that no longer exists.",passageTitle:"Permafrost",questionText:"Read “Permafrost” out loud.",questionTextJunior:"Read “Permafrost” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t7-02",subject:"oral-reading",tier:7,skill:"read-aloud",format:"speak",spokenPassage:"Translating a poem is not the same as translating a set of instructions. A translator must decide, line by line, whether to preserve the literal meaning or the rhythm, knowing that keeping both is usually impossible. The best translations are honest about what they chose to sacrifice.",passageTitle:"The Translator",questionText:"Read “The Translator” out loud.",questionTextJunior:"Read “The Translator” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t7-03",subject:"oral-reading",tier:7,skill:"read-aloud",format:"speak",spokenPassage:"On a remote Norwegian island, a vault buried in a mountainside stores seeds from nearly every food crop on earth. The facility exists so that agriculture could be rebuilt after a catastrophe, whether regional or global. It is, in effect, a backup copy of the world's food supply.",passageTitle:"Seed Vault",questionText:"Read “Seed Vault” out loud.",questionTextJunior:"Read “Seed Vault” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t8-01",subject:"oral-reading",tier:8,skill:"read-aloud",format:"speak",spokenPassage:"Economists use the phrase tragedy of the commons to describe a shared resource that everyone has an incentive to exploit and no one has an incentive to protect. A fishery, a pasture or an atmosphere can be depleted not through malice but through the accumulated weight of individually reasonable decisions. The difficulty is that solutions generally require collective agreement, which is precisely what the situation lacks.",passageTitle:"The Commons",questionText:"Read “The Commons” out loud.",questionTextJunior:"Read “The Commons” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t8-02",subject:"oral-reading",tier:8,skill:"read-aloud",format:"speak",spokenPassage:"Geologists read exposed rock faces the way a historian reads a manuscript, interpreting each layer as evidence of a particular interval of time. A band of ash marks a volcanic eruption; an abrupt change in sediment may record a coastline that advanced or retreated. What appears to be an unremarkable cliff is, to a trained eye, a detailed and largely reliable account.",passageTitle:"Reading the Rock",questionText:"Read “Reading the Rock” out loud.",questionTextJunior:"Read “Reading the Rock” out loud.",options:[],correctAnswerId:""},{id:"ts-or-t8-03",subject:"oral-reading",tier:8,skill:"read-aloud",format:"speak",spokenPassage:"Scientific consensus is frequently misunderstood as a vote, when it is closer to the residue left behind after decades of sustained attempts at refutation. An idea earns consensus not because researchers agree to accept it, but because repeated efforts to demonstrate that it is wrong have failed. That distinction matters enormously when the findings become inconvenient.",passageTitle:"Consensus",questionText:"Read “Consensus” out loud.",questionTextJunior:"Read “Consensus” out loud.",options:[],correctAnswerId:""},{id:"ts-ws-t0-01",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"a",questionText:"Say the word “a” out loud.",questionTextJunior:"Say “a”.",options:[],correctAnswerId:""},{id:"ts-ws-t0-02",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"I",questionText:"Say the word “I” out loud.",questionTextJunior:"Say “I”.",options:[],correctAnswerId:""},{id:"ts-ws-t0-03",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"at",questionText:"Say the word “at” out loud.",questionTextJunior:"Say “at”.",options:[],correctAnswerId:""},{id:"ts-ws-t0-04",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"up",questionText:"Say the word “up” out loud.",questionTextJunior:"Say “up”.",options:[],correctAnswerId:""},{id:"ts-ws-t0-05",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"me",questionText:"Say the word “me” out loud.",questionTextJunior:"Say “me”.",options:[],correctAnswerId:""},{id:"ts-ws-t0-06",subject:"words-speaking",tier:0,skill:"say-the-word",format:"speak",spokenWord:"go",questionText:"Say the word “go” out loud.",questionTextJunior:"Say “go”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-01",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"cat",questionText:"Say the word “cat” out loud.",questionTextJunior:"Say “cat”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-02",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"run",questionText:"Say the word “run” out loud.",questionTextJunior:"Say “run”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-03",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"big",questionText:"Say the word “big” out loud.",questionTextJunior:"Say “big”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-04",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"stop",questionText:"Say the word “stop” out loud.",questionTextJunior:"Say “stop”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-05",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"jump",questionText:"Say the word “jump” out loud.",questionTextJunior:"Say “jump”.",options:[],correctAnswerId:""},{id:"ts-ws-t1-06",subject:"words-speaking",tier:1,skill:"say-the-word",format:"speak",spokenWord:"like",questionText:"Say the word “like” out loud.",questionTextJunior:"Say “like”.",options:[],correctAnswerId:""},{id:"ts-ws-t2-01",su  the matching picture into that box."],["Two ways to move a picture","Drag it across, or tap the picture and then tap the box. Either works, so a small hand that cannot drag yet is never stuck."],["Changing their mind","Tapping a filled box sends that picture back. Nothing is locked in until they press the big green button."],["It reads itself","The instruction is spoken out loud as each puzzle appears, so a child who cannot read never needs you to explain it."]])},"spot-the-difference":{lead:"All of them are the same except one. Find it!",cta:"Start looking",chips:[{label:"Eagle eyes",...ve},{label:"Tap one",...Te},{label:"~2 minutes",...je}],sections:qe([["How it works","A few pictures appear and one of them does not belong. Your child taps that one, then the big green button."],["It gets sneakier","Early on the odd one is a different thing altogether. Later it is the same thing in a different number — and later still, off by just one."],["Changing their mind","Tapping another picture moves the choice to it. Nothing is locked in until they press the green button."],["It reads itself","The question is spoken out loud as each puzzle appears, so a child who cannot read never needs you to explain it."]])},"shapes-colors":{lead:"Shapes and colours — tap the picture being asked for.",cta:"Start shapes & colours",chips:[{label:"Shapes",...ve},{label:"Colours",...Te},{label:"~2 minutes",...je}],sections:qe([["How it works","A voice asks for a shape or a colour. Your child taps the picture that matches."],["No words on the cards","The shapes are unlabelled on purpose — a card reading “Diamond” would make this a reading test, and the children sitting this ride cannot read yet."],["It climbs","Circles and squares first, then colours on their own, then the trickier shapes, and finally both at once — “find the blue triangle”."],["Need a hand?","Tap the speaker to hear the question again, as often as they like."]])},"number-fun":{lead:"Counting and numbers, one little puzzle at a time.",cta:"Start counting",chips:[{label:"Counting",...ve},{label:"Starts easy",...Te},{label:"~2 minutes",...je}],sections:qe([["How it works","Three kinds of question: find a written number, find a group to count, or count a group and tap the number that says how many."],["Fingers allowed","Count on your fingers, out loud, or in your head — whatever helps."],["Need a hand?","Tap the speaker to hear the question again, as often as they like."],["The rules","Numbers to three at the start, then to ten, and only then anything to work out."]])},"letter-sounds":{lead:"Letters and the sounds they make.",cta:"Start letter sounds",chips:[{label:"Listen",...ve},{label:"Tap to pick",...Te},{label:"~3 minutes",...je}],sections:qe([["How it works","Three kinds of question: hear a sound and find the picture that starts with it, see a letter and find the picture, or see a picture and find the letter."],["The sound is heard, not shown","When the question is a sound, it is played and never printed. A letter on the screen would turn “which starts with /b/?” into a question about recognising a B."],["Sound it out","Say the sound aloud together. A mouth often knows before eyes do."],["Need a hand?","Tap the speaker to hear it again, as often as they like."]])},"word-practice":{lead:"Reading whole words, both directions.",cta:"Start word practice",chips:[{label:"Whole words",...ve},{label:"Read aloud",...Te},{label:"~3 minutes",...je}],sections:qe([["How it works","Read a word and find the picture, see a picture and find the word, or read a word out loud."],["The choices look alike on purpose","“nest” sits next to “next” and “best”, not next to “elephant”. A word that looks nothing like the answer tests length, not reading."],["Reading aloud","One question in three asks your child to say the word. There is no timer and no wrong way to try it."],["Need a hand?","Tap the speaker to hear the word, as often as they like."]])},"words-speaking":{lead:"Say each word out loud, clearly, so Ms Hannah can hear you.",cta:"Start speaking",chips:[{label:"Speak aloud",...ve},{label:"One word at a time",...Te},{label:"~3 minutes",...je}],sections:qe([["Before you start","Find a quiet spot. The tablet will ask to use the microphone — your grown-up can say yes and sit nearby."],["Saying the words","One word appears at a time. Tap the microphone, say the word out loud, then tap again when you are done."],["Take your time","There is no countdown and no pass or fail. Not sure how to say it? Tap “Hear it” and then try — your best try is exactly right."],["Moving on","Tap “Next word” when you are ready. You can skip a word and come back to speaking any time."]])},"oral-reading":{lead:"Read each short passage out loud, clearly, so Ms Hannah can hear you.",cta:"Start reading aloud",chips:[{label:"Read aloud",...ve},{label:"Short passages",...Te},{label:"~3 minutes",...je}],sections:qe([["Before you start","Find a quiet spot. The tablet will ask to use the microphone — your grown-up can say yes and sit nearby."],["Reading out loud","A short passage appears. Tap the microphone, read it out loud at your normal speed, then tap again when you reach the end."],["Stuck on a word","Say your best try and keep going, or say “pass” and move to the next word. Getting stuck on one word is not the end of the passage."],["Take your time","There is no countdown and no pass or fail. Tap “Next passage” when you are ready, and you can stop between passages whenever you like."]])},vocabulary:{lead:"Read a word and what it means. Then it disappears, and a question comes.",cta:"Start the word round",chips:[{label:"Read, then answer",...ve},{label:"One word at a time",...Te},{label:"~4 minutes",...je}],sections:qe([["Read it first","A word appears with what it means. Read both, as slowly as you like — nothing is being timed."],["Then it disappears","When you tap “I’ve read it”, the word and its meaning go away and a question takes their place. You get one chance to look again before that
